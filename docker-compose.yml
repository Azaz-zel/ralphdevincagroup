services:
  rdvgroup:
    build: .
    container_name: rdvgroup
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./.env:/var/www/html/.env
      - rdv-storage:/var/www/html/storage/app
    depends_on:
      - rdv-db

  rdv-db:
    image: mysql:8
    container_name: rdv-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ralphdevincagroup
      MYSQL_USER: rdv
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - rdv-db-data:/var/lib/mysql

volumes:
  rdv-storage:
  rdv-db-data:
